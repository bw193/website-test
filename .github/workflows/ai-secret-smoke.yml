name: AI Runtime Secret Smoke Test

on:
  push:
    branches:
      - debug/ai-secret-smoke
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Exercise live AI receptionist and storage path
        id: smoke
        shell: bash
        run: |
          set -euo pipefail

          session_id="smoke-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          turn_id="$(python - <<'PY'
          import uuid
          print(uuid.uuid4())
          PY
          )"

          cat > payload.json <<JSON
          {
            "messages": [
              {
                "role": "user",
                "content": "Reply with one short sentence confirming the BOLEN AI receptionist is available."
              }
            ],
            "language": "en",
            "page": {
              "path": "/en/",
              "title": "BOLEN Mirror"
            },
            "turnId": "${turn_id}",
            "turnNumber": 1
          }
          JSON

          status="$(curl \
            --silent \
            --show-error \
            --max-time 70 \
            --output response.json \
            --write-out '%{http_code}' \
            --request POST \
            'https://bolenmirror.com/api/ai-receptionist' \
            --header 'Content-Type: application/json' \
            --header 'Origin: https://bolenmirror.com' \
            --header 'Sec-Fetch-Site: same-origin' \
            --header "X-AI-Session: ${session_id}" \
            --data-binary @payload.json)"

          echo "HTTP status: ${status}"
          cat response.json
          echo
          echo "session_id=${session_id}" >> "$GITHUB_OUTPUT"

          if [[ "${status}" != "200" ]]; then
            exit 1
          fi

          jq -e '
            .recorded == true
            and (.reply | type == "string" and length > 0)
            and .access.completedTurns == 1
          ' response.json >/dev/null

          {
            echo '### AI runtime smoke test'
            echo
            echo "- HTTP status: ${status}"
            echo "- Session ID: ${session_id}"
            echo '- Recorded response: true'
          } >> "$GITHUB_STEP_SUMMARY"
