name: Cloudflare Wrangler Dry Run

on:
  push:
    branches:
      - debug/cloudflare-dry-run
  workflow_dispatch:

jobs:
  wrangler-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker bundle
        run: npx wrangler deploy --dry-run
