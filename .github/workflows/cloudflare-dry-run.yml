name: Cloudflare Wrangler Dry Run

on:
  push:
    branches:
      - debug/cloudflare-dry-run
  workflow_dispatch:

jobs:
  wrangler-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        id: build
        run: |
          set +e
          npm run build > build.log 2>&1
          status=$?
          cat build.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate Worker bundle
        id: wrangler
        if: steps.build.outputs.status == '0'
        run: |
          set +e
          npx wrangler deploy --dry-run > wrangler.log 2>&1
          status=$?
          cat wrangler.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload diagnostic output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-build-diagnostics
          path: |
            build.log
            wrangler.log
          if-no-files-found: warn

      - name: Fail on diagnostic error
        if: steps.build.outputs.status != '0' || (steps.wrangler.outcome != 'skipped' && steps.wrangler.outputs.status != '0')
        run: exit 1
