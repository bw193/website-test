name: Cloudflare Wrangler Dry Run

on:
  push:
    branches:
      - debug/cloudflare-dry-run
  workflow_dispatch:

jobs:
  wrangler-dry-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Worker bundle
        id: wrangler
        run: |
          set +e
          npx wrangler deploy --dry-run > wrangler.log 2>&1
          status=$?
          cat wrangler.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publish Wrangler output
        if: always()
        run: |
          {
            echo '### Wrangler dry-run'
            echo '```text'
            sed -n '1,220p' wrangler.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail on Wrangler error
        if: steps.wrangler.outputs.status != '0'
        run: exit 1
