name: Cloudflare Runtime Dry Run

on:
  push:
    branches:
      - debug/cloudflare-runtime-fix
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Wrangler deploy dry-run
        id: wrangler
        env:
          SUPABASE_SECRET_KEY: dry-run-placeholder
        run: |
          set +e
          npx wrangler deploy --dry-run > wrangler.log 2>&1
          status=$?
          cat wrangler.log
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload Wrangler log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloudflare-runtime-dry-run-log
          path: wrangler.log
          if-no-files-found: error

      - name: Fail on Wrangler error
        if: steps.wrangler.outputs.status != '0'
        run: exit 1
