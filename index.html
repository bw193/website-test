<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Jiaxing Chengtai Mirror Co., Ltd." />
    <!-- Google Search Console verified via DNS -->
    <!--
      Per-page <title>, description, canonical, hreflang, Open Graph, Twitter, and JSON-LD
      are injected by src/components/SEO.tsx (react-helmet-async) and then baked into each
      route's static HTML by scripts/prerender.ts. Do not add duplicates here — Helmet
      APPENDS meta/link tags (it does not replace them), so any static description / OG /
      Twitter / canonical will collide with the per-route values in the prerendered output.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://mxmmffwntosvwaviippd.supabase.co" crossorigin>
    <link rel="dns-prefetch" href="https://www.googletagmanager.com">
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap">
    </noscript>
    <!-- The LCP hero <img> and its responsive preload are injected per-route by
         scripts/prerender-static.ts (home only). No hardcoded hero preload here:
         the old one pointed at the wrong file (the OG image, not the actual
         hero) and was force-fetched at 1920px on every route. -->
    <link rel="icon" type="image/png" href="https://mxmmffwntosvwaviippd.supabase.co/storage/v1/object/public/comp%20image/logo.png" />
    <title>BOLEN Mirror | LED Mirror Manufacturer & OEM Smart Mirror Factory</title>

    <!-- Inline critical CSS for the non-prerendered loading shell. Generated
         route HTML removes the loader element so crawlers, no-JS users, and
         slow-network visitors see the prerendered fallback content immediately. -->
    <style>
      #root-loader{position:fixed;inset:0;z-index:2147483647;display:flex;align-items:center;justify-content:center;background:#FAF9F6}
      #root-loader .spinner{width:48px;height:48px;border:4px solid #e7e5e4;border-top-color:#d97706;border-radius:50%;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>
    <noscript><style>#root-loader{display:none}</style></noscript>

    <!-- Defer Google Analytics until after page is interactive -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-LF1N3WBQXN', { send_page_view: true });
      (function(){
        function loadGA(){
          var s=document.createElement('script');
          s.src='https://www.googletagmanager.com/gtag/js?id=G-LF1N3WBQXN';
          s.async=true;
          document.head.appendChild(s);
        }
        if('requestIdleCallback' in window){requestIdleCallback(loadGA)}
        else{setTimeout(loadGA,3000)}
      })();
    </script>
  </head>
  <body>
    <div id="root"><div id="root-loader"><div class="spinner"></div></div></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
